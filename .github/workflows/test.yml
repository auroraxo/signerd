name: Policy prototype tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release contract (test/release-contract.test.js) reads the
          # release-tag census from the local object store. With the default
          # fetch-depth 1 / fetch-tags false the checkout has NO tags, so the
          # census had to come from whatever a sibling test happened to fetch
          # — measured 2026-11-07: the README pin v0.2.5 was fetched into
          # refs/tags/ by the tag-materializing tests, the census read
          # "latest release = v0.2.5" against package.json 0.2.6, and a push
          # that touched no tag failed the contract. Full history brings the
          # real tags, so the verdict describes releases instead of checkout
          # bookkeeping.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:install-smoke
      - run: npm run test:crash
      - run: npm run test:crash:sealed

  # The consumer e2e is the client half of the message-grant envelope: the
  # real receipt.py signs through the daemon socket with no key material in
  # the client. It lives in this repo (test/via-signerd-consumer.test.js) but
  # needs the openreceipts checkout as a sibling — same path the local dev
  # layout uses (~/github_repos/{signerd,openreceipts}).
  #
  # A separate job on purpose: openreceipts main is an EXTERNAL repo from this
  # workflow's point of view. If it ever breaks, the daemon's own test job
  # must stay green and only this cross-check goes red.
  consumer-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Same reason as the test job: the consumer e2e runs the same test
          # files' siblings, and a tagless checkout lets the tag census in
          # another test be decided by a partial fetch.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the Python verifier backend
        run: pip install cryptography
      - name: Check out openreceipts next to this repo
        run: git clone --depth 1 https://github.com/auroraxo/openreceipts.git "$GITHUB_WORKSPACE/../openreceipts"
      - run: npm ci --ignore-scripts
      # pretest normally builds tools/leasecheck; this job bypasses npm test.
      # Without the helper the daemon refuses grant reads (fail-closed), so
      # building it is required, not an optimization.
      - run: npm run build
      - run: SIGNERD_OPENRECEIPTS="$GITHUB_WORKSPACE/../openreceipts" node --test test/via-signerd-consumer.test.js
